[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkisp"
version = "0.1.0b2"
authors = [
  { name="jssi" },
]
description = "thinkISP - Configuración y gestión de puntos de acceso para Linux"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console :: Curses",
    "Topic :: System :: Networking",
]

[project.scripts]
thinkisp = "main:main"
isp = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["thinkisp*"]
