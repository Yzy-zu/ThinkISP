# ==============================================================================
# ThinkISP - Configuración de Integración para Hyprland
# ==============================================================================
# Para integrarlo en tu entorno Hyprland, añade la siguiente línea a tu
# archivo de configuración (~/.config/hypr/hyprland.conf):
#
#   source = ~/.config/hypr/thinkisp.conf
#
# O copia directamente estas reglas y atajos a tu hyprland.conf.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Reglas de Ventana (Window Rules)
# Aseguran que el Dashboard TUI de ThinkISP se abra siempre flotante, centrado
# y con las dimensiones ideales para la visualización del panel y gráficos.
# ------------------------------------------------------------------------------

# Sintaxis Hyprland v2 (Recomendada):
windowrulev2 = float, class:^(thinkisp)$
windowrulev2 = size 1000 700, class:^(thinkisp)$
windowrulev2 = center, class:^(thinkisp)$
windowrulev2 = animation popin 85%, class:^(thinkisp)$

# Regla de respaldo por si la terminal solo define el título (title:thinkisp):
windowrulev2 = float, title:^(thinkisp)$
windowrulev2 = size 1000 700, title:^(thinkisp)$
windowrulev2 = center, title:^(thinkisp)$

# Sintaxis Hyprland v1 (Compatibilidad histórica):
# windowrule = float, class:thinkisp
# windowrule = size 1000 700, class:thinkisp
# windowrule = center, class:thinkisp

# ------------------------------------------------------------------------------
# 2. Atajos de Teclado (Keybindings)
# Modificador principal: SUPER ($mainMod)
# ------------------------------------------------------------------------------

# Define tu tecla modificadora (descomentar si no está definida en tu hyprland.conf):
# $mainMod = SUPER

# Lanzar Dashboard interactivo TUI (Flotante y centrado)
# Opción 1: Con Foot (Recomendado para Wayland por ligereza y rapidez)
bind = $mainMod, I, exec, foot -a thinkisp -T thinkisp thinkisp

# Opción 2: Con Kitty (Alternativa común en Hyprland)
# bind = $mainMod, I, exec, kitty --class thinkisp -T thinkisp thinkisp

# Opción 3: Con Alacritty
# bind = $mainMod, I, exec, alacritty --class thinkisp,thinkisp -t thinkisp -e thinkisp

# Toggle rápido: Encender / Apagar la zona Wi-Fi al instante
# Emite notificación OSD con el nuevo estado mediante notify-send
bind = $mainMod SHIFT, I, exec, thinkisp toggle

# Atajo extra: Activar Modo Boost (0 latencia, CPU performance, CAKE QoS)
bind = $mainMod CTRL, I, exec, thinkisp boost

# Atajo extra: Mostrar Código QR en terminal flotante para escanear con móvil
bind = $mainMod ALT, I, exec, foot -a thinkisp -T thinkisp thinkisp qr
