name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test before packaging
        run: python3 -m unittest discover -s tests

      - name: Build release tarball
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          ARCHIVE_NAME="thinkisp-${RELEASE_VERSION}.tar.gz"
          echo "Packaging $ARCHIVE_NAME..."
          tar -czf "$RUNNER_TEMP/$ARCHIVE_NAME" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            main.py thinkisp extras tests docs install.sh pyproject.toml README.md LICENSE CONTRIBUTING.md
          cd "$RUNNER_TEMP"
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/thinkisp-${{ github.ref_name }}.tar.gz
            ${{ runner.temp }}/thinkisp-${{ github.ref_name }}.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
